<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- resizes-content: an on-screen keyboard shrinks the page rather than
	covering its bottom, where the log view's command line is -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>uvcan Fleet</title>
<link rel="stylesheet" href="uvcan-web.css">
<!-- added to a phone's home screen, the page opens without the browser's
	address bar -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-256.png">
</head>
<body>

<!--
	The login page of the browser build of uvcan. The program itself runs on
	app.html, which this page moves on to once the account checks out: a page
	of its own, so that the browser's Back button leaves uvcan, ending it, and
	lands here rather than leaving it running out of sight.

	The form checks the account the same way uvcan itself does: it asks the
	file server which fleets the account holds (GET /fleets.json with Basic
	credentials). The account is then handed to app.html in this tab's
	sessionStorage, which app.html empties as it reads it. The username is
	remembered in this browser.

	For development, ?mqtt=<ws url> points the program at another broker
	listener, e.g. ws://localhost:9001 for a local mosquitto. It is passed on
	to app.html.
-->

<main id="login" class="login">
	<form id="login-form" class="card" autocomplete="on">
		<h1>uvcan <span>Fleet</span></h1>
		<label for="username">Username</label>
		<input id="username" name="username" type="text" autocomplete="username"
				autocapitalize="off" spellcheck="false" required>
		<label for="password">Password</label>
		<input id="password" name="password" type="password"
				autocomplete="current-password" required>
		<button id="login-btn" type="submit">Log in</button>
		<p id="login-msg" class="msg" role="status" aria-live="polite"></p>
	</form>
</main>

<script>
(function () {
	'use strict';

	const form = document.getElementById('login-form');
	const userEl = document.getElementById('username');
	const passEl = document.getElementById('password');
	const btn = document.getElementById('login-btn');
	const msg = document.getElementById('login-msg');

	try {
		const u = localStorage.getItem('uvcan-web-user');
		if (u) {
			userEl.value = u;
			passEl.focus();
		}
		else {
			userEl.focus();
		}
	}
	catch (e) {
		userEl.focus();
	}

	// Back from app.html: the form is as it was left, but not the button,
	// which was left disabled while the login was on its way
	window.addEventListener('pageshow', () => {
		btn.disabled = false;
		say('', false);
	});

	// Basic credentials of any text: btoa() only takes Latin-1
	function basic(user, pass) {
		const bytes = new TextEncoder().encode(user + ':' + pass);
		let bin = '';
		bytes.forEach((b) => { bin += String.fromCharCode(b); });
		return 'Basic ' + btoa(bin);
	}

	function say(text, error) {
		msg.textContent = text;
		msg.classList.toggle('error', !!error);
	}

	async function check(user, pass) {
		let res;
		try {
			// the server's own fleet list, at the root of the host the page is
			// served from
			res = await fetch('/fleets.json', {
				cache: 'no-store',
				credentials: 'omit',
				headers: {
					'Authorization': basic(user, pass),
					// tells the server not to answer with a challenge, which
					// would make the browser ask for the password itself
					'X-Uvcan-Web': '1'
				}
			});
		}
		catch (e) {
			return 'The server could not be reached.';
		}
		if (res.status === 401 || res.status === 403) {
			return 'Wrong username or password.';
		}
		if (!res.ok) {
			return 'The server answered ' + res.status + '.';
		}
		return '';
	}

	form.addEventListener('submit', async (e) => {
		e.preventDefault();
		const user = userEl.value.trim();
		const pass = passEl.value;
		btn.disabled = true;
		say('Logging in…', false);
		const err = await check(user, pass);
		if (err) {
			btn.disabled = false;
			say(err, true);
			passEl.select();
			return;
		}
		try {
			localStorage.setItem('uvcan-web-user', user);
		}
		catch (e2) {
			// remembering the name is only a convenience
		}
		try {
			sessionStorage.setItem('uvcan-web-login',
					JSON.stringify({ username: user, password: pass }));
		}
		catch (e3) {
			btn.disabled = false;
			say('This browser does not let the page keep the login ' +
					'(private mode?).', true);
			return;
		}
		passEl.value = '';
		// a new history entry, which is what Back returns from
		location.assign('app.html' + location.search);
	});
})();
</script>
</body>
</html>
